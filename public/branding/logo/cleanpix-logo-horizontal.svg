<svg width="240" height="56" viewBox="0 0 240 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hChecker" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#1E2442"/>
      <rect x="3" width="3" height="3" fill="#13172E"/>
      <rect y="3" width="3" height="3" fill="#13172E"/>
      <rect x="3" y="3" width="3" height="3" fill="#1E2442"/>
    </pattern>

    <linearGradient id="hIconGrad" x1="6" y1="6" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="hTextPixGrad" x1="140" y1="18" x2="225" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="hSparkleGrad" x1="0" y1="-8" x2="8" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="hIconClip">
      <circle cx="26" cy="28" r="11"/>
    </clipPath>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(2, 0)">
    <!-- Ambient Icon Glow -->
    <circle cx="26" cy="28" r="22" fill="#38BDF8" fill-opacity="0.12" filter="url(#hGlow)"/>

    <!-- Mini Orbit -->
    <ellipse cx="27" cy="29" rx="21" ry="9" transform="rotate(-20 27 29)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>

    <!-- Inner Checkerboard Disc -->
    <g clip-path="url(#hIconClip)">
      <rect x="15" y="17" width="22" height="22" fill="url(#hChecker)"/>
      <circle cx="26" cy="28" r="11" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" fill="none"/>
    </g>

    <!-- Glass "C" Ribbon -->
    <path d="M 37 16
             C 31 11, 21 11, 15 17
             C 8 23, 8 33, 14 39
             C 21 45, 31 45, 37 39
             C 39 37, 38 34, 35 34
             C 30 34, 28 37, 23 37
             C 17 37, 14 32, 15 28
             C 16 23, 20 19, 25 19
             C 29 19, 32 21, 35 21
             C 38 21, 39 19, 37 16 Z"
          fill="url(#hIconGrad)"
          fill-opacity="0.3"
          stroke="url(#hIconGrad)"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#hGlow)"/>

    <!-- Top White Specular Edge -->
    <path d="M 36 17 C 31 12, 22 12, 16 18 C 10 24, 10 32, 15 38"
          stroke="#FFFFFF"
          stroke-width="1"
          stroke-linecap="round"
          stroke-opacity="0.85"
          fill="none"/>

    <!-- Docked AI Sparkle -->
    <g transform="translate(42, 26)">
      <path d="M 0 -8 C 0.3 -2.5, 2.5 -0.3, 8 0 C 2.5 0.3, 0.3 2.5, 0 8 C -0.3 2.5, -2.5 0.3, -8 0 C -2.5 -0.3, -0.3 -2.5, 0 -8 Z"
            fill="url(#hSparkleGrad)"
            filter="url(#hGlow)"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Wordmark "CleanPix" -->
  <g transform="translate(62, 36)">
    <!-- "Clean" in Bold White -->
    <text x="0" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif"
          font-size="24"
          font-weight="700"
          letter-spacing="-0.03em"
          fill="#FFFFFF">Clean</text>

    <!-- "Pix" in Cyan-Violet Gradient -->
    <text x="69" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif"
          font-size="24"
          font-weight="800"
          letter-spacing="-0.03em"
          fill="url(#hTextPixGrad)">Pix</text>

    <!-- Star dot on 'i' in Pix -->
    <g transform="translate(86.5, -24.5)">
      <path d="M 0 -4.5 C 0.2 -1.5, 1.5 -0.2, 4.5 0 C 1.5 0.2, 0.2 1.5, 0 4.5 C -0.2 1.5, -1.5 0.2, -4.5 0 C -1.5 -0.2, -0.2 -1.5, 0 -4.5 Z"
            fill="#38BDF8"/>
      <circle cx="0" cy="0" r="1" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
