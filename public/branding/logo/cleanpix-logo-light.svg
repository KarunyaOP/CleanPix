<svg width="240" height="56" viewBox="0 0 240 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="lightChecker" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#E2E8F0"/>
      <rect x="3" width="3" height="3" fill="#F8FAFC"/>
      <rect y="3" width="3" height="3" fill="#F8FAFC"/>
      <rect x="3" y="3" width="3" height="3" fill="#E2E8F0"/>
    </pattern>

    <linearGradient id="lightIconGrad" x1="6" y1="6" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="75%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="lightTextPixGrad" x1="140" y1="18" x2="225" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <clipPath id="lightIconClip">
      <circle cx="26" cy="28" r="11"/>
    </clipPath>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(2, 0)">
    <!-- Mini Orbit -->
    <ellipse cx="27" cy="29" rx="21" ry="9" transform="rotate(-20 27 29)" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

    <!-- Inner Checkerboard Disc -->
    <g clip-path="url(#lightIconClip)">
      <rect x="15" y="17" width="22" height="22" fill="url(#lightChecker)"/>
      <circle cx="26" cy="28" r="11" stroke="#CBD5E1" stroke-width="1" fill="none"/>
    </g>

    <!-- Glass "C" Ribbon -->
    <path d="M 37 16
             C 31 11, 21 11, 15 17
             C 8 23, 8 33, 14 39
             C 21 45, 31 45, 37 39
             C 39 37, 38 34, 35 34
             C 30 34, 28 37, 23 37
             C 17 37, 14 32, 15 28
             C 16 23, 20 19, 25 19
             C 29 19, 32 21, 35 21
             C 38 21, 39 19, 37 16 Z"
          fill="url(#lightIconGrad)"
          fill-opacity="0.18"
          stroke="url(#lightIconGrad)"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Specular Highlight -->
    <path d="M 36 17 C 31 12, 22 12, 16 18 C 10 24, 10 32, 15 38"
          stroke="#FFFFFF"
          stroke-width="1.2"
          stroke-linecap="round"
          fill="none"/>

    <!-- Docked AI Sparkle -->
    <g transform="translate(42, 26)">
      <path d="M 0 -8 C 0.3 -2.5, 2.5 -0.3, 8 0 C 2.5 0.3, 0.3 2.5, 0 8 C -0.3 2.5, -2.5 0.3, -8 0 C -2.5 -0.3, -0.3 -2.5, 0 -8 Z"
            fill="url(#lightIconGrad)"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Wordmark "CleanPix" -->
  <g transform="translate(62, 36)">
    <!-- "Clean" -->
    <text x="0" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif"
          font-size="24"
          font-weight="700"
          letter-spacing="-0.03em"
          fill="#0F172A">Clean</text>

    <!-- "Pix" -->
    <text x="69" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif"
          font-size="24"
          font-weight="800"
          letter-spacing="-0.03em"
          fill="url(#lightTextPixGrad)">Pix</text>

    <!-- Sparkle on 'i' -->
    <g transform="translate(86.5, -24.5)">
      <path d="M 0 -4.5 C 0.2 -1.5, 1.5 -0.2, 4.5 0 C 1.5 0.2, 0.2 1.5, 0 4.5 C -0.2 1.5, -1.5 0.2, -4.5 0 C -1.5 -0.2, -0.2 -1.5, 0 -4.5 Z"
            fill="#0284C7"/>
      <circle cx="0" cy="0" r="1" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
