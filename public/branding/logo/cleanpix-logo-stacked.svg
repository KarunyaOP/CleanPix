<svg width="320" height="200" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="sChecker" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#1E2442"/>
      <rect x="5" width="5" height="5" fill="#13172E"/>
      <rect y="5" width="5" height="5" fill="#13172E"/>
      <rect x="5" y="5" width="5" height="5" fill="#1E2442"/>
    </pattern>

    <linearGradient id="sIconGrad" x1="120" y1="20" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="sTextPixGrad" x1="160" y1="120" x2="230" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="sSparkleGrad" x1="0" y1="-12" x2="12" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="sGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="sIconClip">
      <circle cx="155" cy="58" r="22"/>
    </clipPath>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="160" cy="58" r="50" fill="#38BDF8" fill-opacity="0.12" filter="url(#sGlow)"/>

  <!-- Centered Icon Mark -->
  <g transform="translate(5, 0)">
    <!-- Orbit -->
    <ellipse cx="155" cy="60" rx="42" ry="18" transform="rotate(-20 155 60)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>

    <!-- Inner Checkerboard Disc -->
    <g clip-path="url(#sIconClip)">
      <rect x="130" y="35" width="50" height="50" fill="url(#sChecker)"/>
      <circle cx="155" cy="58" r="22" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" fill="none"/>
    </g>

    <!-- Glass "C" Body -->
    <path d="M 178 35
             C 166 24, 146 24, 134 36
             C 120 48, 120 68, 132 80
             C 146 92, 166 92, 178 80
             C 182 76, 180 70, 174 70
             C 164 70, 160 76, 150 76
             C 138 76, 132 66, 134 58
             C 136 48, 144 40, 154 40
             C 162 40, 168 44, 174 44
             C 180 44, 182 40, 178 35 Z"
          fill="url(#sIconGrad)"
          fill-opacity="0.3"
          stroke="url(#sIconGrad)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#sGlow)"/>

    <!-- Top White Specular Highlight -->
    <path d="M 176 37 C 166 26, 148 26, 136 38 C 124 50, 124 66, 134 78"
          stroke="#FFFFFF"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-opacity="0.85"
          fill="none"/>

    <!-- AI Sparkle -->
    <g transform="translate(188, 54)">
      <path d="M 0 -14 C 0.4 -4, 4 -0.4, 14 0 C 4 0.4, 0.4 4, 0 14 C -0.4 4, -4 0.4, -14 0 C -4 -0.4, -0.4 -4, 0 -14 Z"
            fill="url(#sSparkleGrad)"
            filter="url(#sGlow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Wordmark "CleanPix" Centered -->
  <g transform="translate(160, 140)" text-anchor="middle">
    <!-- "Clean" -->
    <text x="-24" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif"
          font-size="28"
          font-weight="700"
          letter-spacing="-0.03em"
          fill="#FFFFFF">Clean</text>

    <!-- "Pix" -->
    <text x="44" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif"
          font-size="28"
          font-weight="800"
          letter-spacing="-0.03em"
          fill="url(#sTextPixGrad)">Pix</text>

    <!-- Sparkle on 'i' -->
    <g transform="translate(42, -28)">
      <path d="M 0 -5 C 0.2 -1.5, 1.5 -0.2, 5 0 C 1.5 0.2, 0.2 1.5, 0 5 C -0.2 1.5, -1.5 0.2, -5 0 C -1.5 -0.2, -0.2 -1.5, 0 -5 Z"
            fill="#38BDF8"/>
      <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Tagline -->
  <text x="160" y="172"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="10.5"
        font-weight="600"
        letter-spacing="0.25em"
        fill="#94A3B8">AI BACKGROUND REMOVAL</text>
</svg>
